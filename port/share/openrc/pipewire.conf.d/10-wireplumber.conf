# omarchy-port (OpenRC): WirePlumber jako proces startowany przez pipewire — sesja bez systemd --user.
# Ten sam model co na Voidzie (tam plik daje pakiet: /usr/share/examples/wireplumber/10-wireplumber.conf);
# nadzorca unitów portu startuje sam `pipewire`, reszta wstaje stąd.
context.exec = [
    { path = "/usr/bin/wireplumber" args = "" }
]
